<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health Tracker">
<meta name="theme-color" content="#0A4F57">
<title>Theresa Borowski · Health &amp; Activity Tracker</title>
<style>
  :root{
    --teal:#0E7C86;
    --teal-deep:#0A4F57;
    --teal-soft:#6FA8AE;
    --ink:#283238;
    --muted:#8B98A0;
    --line:#D7DEE2;
    --cream:#FBFAF7;
    --move:#0A4F57;
    --exercise:#0E7C86;
    --stand:#6FA8AE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:#F4F6F6;
  }
  .app{max-width:760px; margin:0 auto; padding:18px 16px 80px;}
  .brand{
    text-align:center; padding:22px 10px 14px;
  }
  .brand h1{
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    color:var(--teal-deep); font-size:30px; margin:0 0 2px;
  }
  .brand .sub{
    letter-spacing:2px; font-size:11px; font-weight:700; color:var(--teal);
    text-transform:uppercase; margin:4px 0;
  }
  .brand .years{
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    color:var(--teal); font-size:17px; margin:2px 0 10px;
  }
  .brand .quote{
    font-style:italic; color:var(--muted); font-size:13px; max-width:420px;
    margin:6px auto 0; line-height:1.5;
  }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin:18px 0 14px; flex-wrap:wrap;
  }
  .btn{
    border:1.4px solid var(--teal); background:#fff; color:var(--teal);
    font-weight:700; font-size:13px; padding:8px 14px; border-radius:20px;
    cursor:pointer; user-select:none;
  }
  .btn:hover{background:#EAF4F4;}
  .btn.ghost{border-color:var(--line); color:var(--muted);}

  .week-list{
    display:grid; grid-template-columns:1fr; gap:8px;
  }
  .week-row{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; cursor:pointer;
  }
  .week-row:hover{border-color:var(--teal);}
  .week-row .label{font-weight:700; color:var(--teal-deep); font-size:14px;}
  .week-row .range{color:var(--muted); font-size:12.5px;}
  .week-row .arrow{color:var(--teal); font-size:15px;}

  .week-header{
    background:#fff; border:1.4px solid var(--teal); border-radius:14px;
    padding:16px 20px; margin-bottom:16px;
  }
  .week-header h2{
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    color:var(--teal-deep); margin:0 0 2px; font-size:22px;
  }
  .week-header .range{color:var(--muted); font-size:13px;}

  .day-card{
    background:var(--cream); border-radius:14px; border:1.4px solid var(--accent, var(--teal));
    padding:16px 18px 14px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .day-card::before{
    content:""; position:absolute; left:5px; top:14px; bottom:14px; width:4px;
    border-radius:3px; background:var(--accent, var(--teal));
  }
  .day-card .head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1.3px solid var(--accent, var(--teal)); padding-bottom:8px; margin-bottom:12px;
  }
  .day-card .head .dayname{
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    color:var(--accent, var(--teal)); font-size:20px;
  }
  .day-card .head .date{color:var(--muted); font-size:12.5px; display:flex; align-items:center; gap:5px;}

  .pillrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    border:1.3px solid var(--accent, var(--teal)); color:var(--accent, var(--teal));
    border-radius:14px; padding:5px 12px; font-size:11px; font-weight:700; letter-spacing:0.5px;
  }
  .field-inline{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink);}
  .field-inline input{
    border:none; border-bottom:1.4px solid var(--line); background:transparent;
    padding:3px 2px; font-size:13px; width:90px; color:var(--ink);
  }
  .field-inline input:focus{outline:none; border-color:var(--teal);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; margin-bottom:12px;}
  .field{display:flex; flex-direction:column; gap:2px;}
  .field label{font-size:11.5px; color:var(--muted); font-weight:600;}
  .field .static{font-weight:700; font-size:14px; color:var(--ink);}
  .field input, .field textarea{
    border:none; border-bottom:1.4px solid var(--line); background:transparent;
    padding:5px 2px; font-size:14px; color:var(--ink); font-family:inherit;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--teal);}

  .rings{display:flex; gap:22px; margin:14px 0; flex-wrap:wrap;}
  .ring-toggle{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .ring-toggle .circle{
    width:26px; height:26px; border-radius:50%; border:3.4px solid var(--rc,var(--teal));
    background:transparent; transition:background .15s;
  }
  .ring-toggle.checked .circle{background:var(--rc,var(--teal));}
  .ring-toggle span.lbl{font-size:12.5px; font-weight:700; color:var(--rc,var(--teal));}

  .notes-field textarea{
    width:100%; min-height:54px; resize:vertical; border:1.3px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:13px;
  }
  .notes-field label{font-size:11.5px; color:var(--accent,var(--teal)); font-weight:700; display:block; margin-bottom:4px;}

  .summary-card{
    background:#fff; border:1.6px solid var(--teal-deep); border-radius:14px;
    padding:18px 20px; margin-top:6px;
  }
  .summary-card h2{
    font-family:Georgia,'Times New Roman',serif; font-style:italic; color:var(--teal-deep);
    margin:0 0 12px; font-size:21px; border-bottom:1.3px solid var(--teal-deep); padding-bottom:8px;
  }
  .goal-boxes{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .goal-box{
    border:1.2px solid var(--teal-soft); border-radius:8px; padding:10px 12px;
  }
  .goal-box .lbl{font-size:10.5px; letter-spacing:0.5px; color:var(--muted); font-weight:700;}
  .goal-box .val{font-size:19px; font-weight:700; margin-top:4px;}
  .stat-rows{display:grid; grid-template-columns:1fr 1fr; gap:8px 24px;}
  .stat-row{display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:5px 0; font-size:13.5px;}
  .stat-row .k{color:var(--ink);}
  .stat-row .v{font-weight:700; color:var(--teal-deep);}
  .day-card.is-today{
    box-shadow:0 0 0 2.5px var(--accent, var(--teal));
  }
  .day-card.is-today::after{
    content:"TODAY"; position:absolute; top:0; right:0;
    background:var(--accent, var(--teal)); color:#fff;
    font-size:9px; font-weight:800; letter-spacing:1px;
    padding:3px 9px; border-radius:0 12px 0 10px;
  }

  .row-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .row-hearts{
    display:inline-flex; align-items:center; gap:1px;
    max-width:110px; flex-wrap:wrap; justify-content:flex-end;
  }
  .row-hearts .icon{display:block;}

  .week-row.has-period .label,
  .week-row.has-period .range,
  .week-row.has-period .arrow{color:#E0245E;}
  .week-row.has-period{border-color:#F2C4D1;}

  .wt-summary{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--muted); padding:0 2px 8px;
  }
  .wt-wrap{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .wt-table{width:100%; border-collapse:collapse; font-size:13px;}
  .wt-table th{
    text-align:left; font-size:9.5px; letter-spacing:0.4px; text-transform:uppercase;
    color:var(--muted); font-weight:700; padding:9px 7px; background:#F7FAFA;
    border-bottom:1px solid var(--line); white-space:nowrap;
  }
  .wt-table td{padding:9px 7px; border-bottom:1px solid #EEF2F4;}
  .wt-table tr:last-child td{border-bottom:none;}
  .wt-table th:nth-child(n+2), .wt-table td:nth-child(n+2){text-align:right;}
  .wt-table tr.row-red td{background:#FDF3F6;}
  .wt-table tr.row-red .wt-date,
  .wt-table tr.row-red .wt-val{color:#E0245E;}
  .wt-table tr.row-red .wt-day{color:#D08A9F;}

  .wt-date{color:var(--ink); white-space:nowrap;}
  .wt-day{color:var(--muted); font-size:11px; margin-left:6px;}
  .wt-val{font-weight:700; color:var(--ink); white-space:nowrap;}
  .wt-delta{white-space:nowrap; font-weight:600;}
  .wt-down{color:var(--teal);}
  .wt-up{color:#C2683A;}
  .wt-flat{color:var(--muted);}

  .week-row.is-done{background:#F4FAFA; border-color:#CFE3E3; opacity:0.78;}
  .week-row.is-done .label{color:var(--muted);}
  .week-row.is-done .range{color:#A9B4BB;}
  .done-tick{color:var(--teal); font-weight:900; font-size:12px;}
  .week-row.has-period.is-done .label,
  .week-row.has-period.is-done .range{color:#D08A9F;}

  .day-card.is-complete{background:#F4FAFA;}

  .tap-icon{
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; padding:4px; margin:-4px -1px;
    border-radius:50%; transition:transform .12s;
  }
  .tap-icon:active{transform:scale(0.85);}
  .tap-icon.on{transform:scale(1.05);}

  .summary-notes{margin-top:14px;}
  .summary-notes label{
    display:block; font-size:11px; font-weight:700; letter-spacing:0.5px;
    color:var(--teal-deep); text-transform:uppercase; margin-bottom:5px;
  }
  .summary-notes textarea{
    width:100%; min-height:64px; resize:vertical; border:1.3px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; color:var(--ink);
  }
  .summary-notes textarea:focus{outline:none; border-color:var(--teal);}

  .live-note{font-size:11px; color:var(--muted); margin-top:10px; font-style:italic;}

  .weight-panel{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;
  }
  .weight-box{
    background:#fff; border:1.3px solid var(--line); border-radius:12px; padding:11px 14px;
  }
  .weight-box .lbl{
    font-size:10px; font-weight:700; letter-spacing:0.6px; color:var(--muted);
    text-transform:uppercase; margin-bottom:5px;
  }
  .weight-box input{
    width:100%; border:none; border-bottom:1.4px solid var(--line); background:transparent;
    font-size:20px; font-weight:700; color:var(--ink); padding:2px 0; font-family:inherit;
  }
  .weight-box input:focus{outline:none; border-color:var(--teal);}
  .weight-box .cur{font-size:20px; font-weight:700; color:var(--ink);}
  .weight-box .chg{font-size:13px; font-weight:700; margin-top:3px;}
  .weight-box .chg.loss{color:var(--teal);}
  .weight-box .chg.gain{color:#C2683A;}
  .weight-box .chg.none{color:var(--muted); font-weight:600;}

  .backup-banner{
    display:flex; align-items:center; gap:10px;
    background:#EAF4F4; border:1.3px solid var(--teal-soft); border-radius:10px;
    padding:10px 14px; margin-bottom:14px; font-size:12.5px; color:var(--teal-deep);
  }
  .backup-banner strong{font-weight:700;}
  .backup-caption{font-size:11px; color:var(--muted); margin:-4px 0 14px 2px;}

  .iron-pill{
    display:inline-flex; align-items:center; gap:5px;
    border:1.3px solid var(--teal-deep); color:var(--teal-deep);
    border-radius:14px; padding:4px 10px; font-size:11px; font-weight:700; letter-spacing:0.5px;
  }
  .iron-pill input{
    width:34px; border:none; border-bottom:1.3px solid var(--teal-soft);
    background:transparent; color:var(--teal-deep); font-weight:700; font-size:12.5px;
    text-align:center; padding:1px 0; font-family:inherit;
  }
  .iron-pill input:focus{outline:none; border-color:var(--teal-deep);}

  .iron-done{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    border:1.3px solid var(--teal-deep); border-radius:14px; padding:4px 12px;
  }
  .iron-done .box{
    width:15px; height:15px; border-radius:4px; border:2px solid var(--teal-deep);
    display:inline-block; position:relative; transition:background .15s;
  }
  .iron-done .lbl{font-size:11px; font-weight:700; letter-spacing:0.4px; color:var(--teal-deep); text-transform:uppercase;}
  .iron-done.checked{background:var(--teal-deep);}
  .iron-done.checked .box{background:#fff; border-color:#fff;}
  .iron-done.checked .box::after{
    content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--teal-deep); font-size:12px; font-weight:900; line-height:1;
  }
  .iron-done.checked .lbl{color:#fff;}

  .run-done{border-color:var(--teal);}
  .run-done .box{border-color:var(--teal);}
  .run-done .lbl{color:var(--teal);}
  .run-done.checked{background:var(--teal);}
  .run-done.checked .box::after{color:var(--teal);}
  .view-toggle{display:flex; gap:8px;}
  .btn.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .month-row .label{font-weight:700; color:var(--teal-deep); font-size:14px;}

  .year-bar{
    display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px;
    -webkit-overflow-scrolling:touch;
  }
  .year-btn{
    flex:0 0 auto; border:1.3px solid var(--line); background:#fff; color:var(--muted);
    font-weight:700; font-size:12.5px; padding:6px 14px; border-radius:16px; cursor:pointer;
  }
  .year-btn.active{background:var(--teal-deep); color:#fff; border-color:var(--teal-deep);}

  .icon{display:inline-block; vertical-align:middle;}
  .save-flag{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--teal-deep); color:#fff; font-size:12px; padding:7px 16px;
    border-radius:20px; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .save-flag.show{opacity:0.92;}

  @media (max-width:480px){
    .grid2{grid-template-columns:1fr;}
    .goal-boxes{grid-template-columns:1fr;}
    .stat-rows{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="save-flag" id="saveFlag">Saved</div>

<script>
/* ---------------- data model ---------------- */
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const WEEKDAY_PLAN = [
  {type:"Rest/Walk", cal:200,  iron:false}, // Mon
  {type:"Iron",       cal:3500, iron:true }, // Tue
  {type:"Rest/Walk", cal:200,  iron:false}, // Wed
  {type:"Iron",       cal:3500, iron:true }, // Thu
  {type:"Rest/Walk", cal:200,  iron:false}, // Fri
  {type:"Run",        cal:1500, iron:false}, // Sat
  {type:"Iron",       cal:3500, iron:true }, // Sun
];
const TODAY = new Date(2026,6,29);        // Wed Jul 29 2026 ("today")
const WEEK1_MONDAY = new Date(2026,7,3);  // Mon Aug 3 2026
const NUM_WEEKS = 261;                    // 5 years (Aug 3 2026 - Aug 3 2031)
const START_IRON = 23;                    // tomorrow (Jul 30) = Iron Day 23

function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function mondayIndex(d){ return (d.getDay()+6)%7; }
function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+da;
}
function fmtShort(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function fmtFull(d){ return d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); }
function fmtCardDate(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }

let ironCounter = START_IRON;
function makeDay(date){
  const wd = mondayIndex(date);
  const plan = WEEKDAY_PLAN[wd];
  let ironDay = null;
  if (plan.iron){ ironDay = ironCounter; ironCounter++; if(ironCounter>30) ironCounter=1; }
  return {date, dayName:DAY_NAMES[wd], dayType:plan.type, targetCal:plan.cal, ironDay};
}

const WEEKS = [];
(function build(){
  let d = new Date(TODAY);
  const week0 = [];
  while (d < WEEK1_MONDAY){ week0.push(makeDay(new Date(d))); d = addDays(d,1); }
  if (week0.length) WEEKS.push({label:"Week 0", isLeadIn:true, days:week0});
  for (let wn=0; wn<NUM_WEEKS; wn++){
    const wstart = addDays(WEEK1_MONDAY, wn*7);
    const days = [];
    for (let i=0;i<7;i++) days.push(makeDay(addDays(wstart,i)));
    WEEKS.push({label:"", isLeadIn:false, days});
  }

  // Week numbers restart at 1 each calendar year (by the week's start date).
  // Storage keys use the array index, not the label, so renumbering is display-only.
  const perYear = {};
  WEEKS.forEach(wk=>{
    if(wk.isLeadIn){ wk.weekNum = 0; wk.year = wk.days[0].date.getFullYear(); return; }
    const y = wk.days[0].date.getFullYear();
    perYear[y] = (perYear[y] || 0) + 1;
    wk.weekNum = perYear[y];
    wk.year = y;
    wk.label = "Week " + perYear[y];
  });
  WEEKS.forEach(wk=>{ wk.weeksInYear = perYear[wk.year] || 0; });
})();

/* ---------------- month index (for monthly summaries) ---------------- */
const MONTHS = [];
(function buildMonths(){
  const map = new Map();
  WEEKS.forEach((wk, wi)=>{
    wk.days.forEach(d=>{
      const key = d.date.getFullYear()+"-"+String(d.date.getMonth()+1).padStart(2,"0");
      if(!map.has(key)) map.set(key, {key, year:d.date.getFullYear(), month:d.date.getMonth(), entries:[]});
      map.get(key).entries.push({day:d, weekIdx:wi});
    });
  });
  Array.from(map.values())
    .sort((a,b)=> a.year-b.year || a.month-b.month)
    .forEach(m=>MONTHS.push(m));
})();

/* Per-year day index, for the yearly summaries. */
const YEAR_INDEX = [];
(function buildYears(){
  const map = new Map();
  WEEKS.forEach((wk, wi)=>{
    wk.days.forEach(d=>{
      const y = d.date.getFullYear();
      if(!map.has(y)) map.set(y, {year:y, entries:[]});
      map.get(y).entries.push({day:d, weekIdx:wi});
    });
  });
  Array.from(map.values()).sort((a,b)=>a.year-b.year).forEach(y=>YEAR_INDEX.push(y));
})();

function fmtMonth(m){
  return new Date(m.year, m.month, 1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
}

/* ---------------- year index (keeps the long 5-year lists navigable) ---------------- */
const YEARS = Array.from(new Set([
  ...WEEKS.map(wk=>wk.days[0].date.getFullYear()),
  ...MONTHS.map(m=>m.year)
])).sort((a,b)=>a-b);

function defaultYear(){
  const nowY = new Date().getFullYear();
  if(YEARS.includes(nowY)) return nowY;
  return YEARS[0];
}

/* Effective iron day = user override if present, else the planned value. */
function effectiveIronDay(d, rec){
  if(rec && rec.ironDay!==undefined && rec.ironDay!=="" && rec.ironDay!==null){
    const n = parseInt(rec.ironDay,10);
    if(!isNaN(n)) return n;
  }
  return d.ironDay;
}

/* Effective target calories = user override if present, else the planned value. */
function effectiveTarget(d, rec){
  if(rec && rec.targetCal!==undefined && rec.targetCal!=="" && rec.targetCal!==null){
    const n = parseFloat(rec.targetCal);
    if(!isNaN(n)) return n;
  }
  return d.targetCal;
}

/* ---------------- starting weight + progress ---------------- */
/* Fixed baseline - not user-editable. */
const START_WEIGHT = 168.4;
const START_WEIGHT_DATE = "June 24, 2026";

function getStartWeight(){ return START_WEIGHT; }

/* Scans every stored week for the most recent dated weight entry. */
function latestWeight(){
  let best = null;
  for(let i=0;i<WEEKS.length;i++){
    let raw;
    try{ raw = localStorage.getItem("thb_tracker_week_"+i); }catch(e){ continue; }
    if(!raw) continue;
    let obj;
    try{ obj = JSON.parse(raw); }catch(e){ continue; }
    WEEKS[i].days.forEach(d=>{
      const key = iso(d.date);
      const rec = obj[key];
      if(!rec) return;
      const w = parseFloat(rec.weight);
      if(isNaN(w)) return;
      if(best===null || key > best.key) best = {key, weight:w};
    });
  }
  return best;
}

/* Does this week have any day flagged as a period day?
   Reads localStorage synchronously so the home list can colour rows. */
function weekHasPeriod(weekIdx){
  let raw;
  try{ raw = localStorage.getItem("thb_tracker_week_"+weekIdx); }catch(e){ return false; }
  if(!raw) return false;
  let obj;
  try{ obj = JSON.parse(raw); }catch(e){ return false; }
  return WEEKS[weekIdx].days.some(d=>{
    const rec = obj[iso(d.date)];
    return !!(rec && rec.period);
  });
}

/* How many days in this week have the heart filled in? */
function weekHeartCount(weekIdx){
  const obj = weekRecords(weekIdx);
  if(!obj) return 0;
  let n = 0;
  WEEKS[weekIdx].days.forEach(d=>{
    const rec = obj[iso(d.date)];
    if(rec && rec.heart) n++;
  });
  return n;
}

/* How many days in this week have the teardrop (period) filled in? */
function weekPeriodCount(weekIdx){
  const obj = weekRecords(weekIdx);
  if(!obj) return 0;
  let n = 0;
  WEEKS[weekIdx].days.forEach(d=>{
    const rec = obj[iso(d.date)];
    if(rec && rec.period) n++;
  });
  return n;
}

/* How many days in this week have the star filled in? */
function weekStarCount(weekIdx){
  const obj = weekRecords(weekIdx);
  if(!obj) return 0;
  let n = 0;
  WEEKS[weekIdx].days.forEach(d=>{
    const rec = obj[iso(d.date)];
    if(rec && rec.star) n++;
  });
  return n;
}

/* Cached synchronous read of a week's stored records. */
function weekRecords(weekIdx){
  let raw;
  try{ raw = localStorage.getItem("thb_tracker_week_"+weekIdx); }catch(e){ return null; }
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

/* A week / month / year counts as "complete" once every one of its days
   has been marked complete. Empty periods are never complete. */
function weekIsComplete(weekIdx){
  const obj = weekRecords(weekIdx);
  if(!obj) return false;
  return WEEKS[weekIdx].days.every(d=>{
    const rec = obj[iso(d.date)];
    return !!(rec && rec.complete);
  });
}

function entriesAreComplete(entries){
  if(!entries.length) return false;
  const cache = {};
  return entries.every(e=>{
    if(cache[e.weekIdx]===undefined) cache[e.weekIdx] = weekRecords(e.weekIdx);
    const obj = cache[e.weekIdx];
    if(!obj) return false;
    const rec = obj[iso(e.day.date)];
    return !!(rec && rec.complete);
  });
}

/* Every logged weigh-in across the whole plan, oldest first. */
function allWeighIns(){
  const out = [];
  for(let i=0;i<WEEKS.length;i++){
    const obj = weekRecords(i);
    if(!obj) continue;
    WEEKS[i].days.forEach(d=>{
      const key = iso(d.date);
      const rec = obj[key];
      if(!rec) return;
      const w = parseFloat(rec.weight);
      if(isNaN(w)) return;
      out.push({key, date:d.date, weight:w, dayName:d.dayName, weekIdx:i});
    });
  }
  out.sort((a,b)=> a.key < b.key ? -1 : (a.key > b.key ? 1 : 0));
  return out;
}

/* Per-week calorie averages. Uses the same computeStats() the weekly summary
   uses, so the numbers always match what you see inside the week. */
function weeklyCalorieRows(){
  const out = [];
  for(let i=0;i<WEEKS.length;i++){
    const obj = weekRecords(i);
    if(!obj) continue;
    const pairs = WEEKS[i].days.map(d=>({day:d, rec:obj[iso(d.date)]}));
    const s = computeStats(pairs);
    if(s.calCount === 0) continue;          // nothing logged that week
    out.push({
      idx:i, wk:WEEKS[i], stats:s,
      start:WEEKS[i].days[0].date,
      end:WEEKS[i].days[WEEKS[i].days.length-1].date
    });
  }
  return out;
}

/* ---------------- storage helpers (localStorage - works fully offline,
   standalone, and when added to your Home Screen) ---------------- */
async function loadWeek(idx){
  try{
    const raw = localStorage.getItem("thb_tracker_week_"+idx);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
let saveTimer=null;
function scheduleSave(idx, data){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem("thb_tracker_week_"+idx, JSON.stringify(data));
      flashSaved();
    }catch(e){ console.error("save failed", e); }
  }, 450);
}
function flashSaved(msg){
  const el = document.getElementById("saveFlag");
  el.textContent = msg || "Saved";
  el.classList.add("show");
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>{ el.classList.remove("show"); el.textContent="Saved"; }, msg ? 1800 : 900);
}

/* ---------------- rendering ---------------- */
const app = document.getElementById("app");

/* Jump back to the top on every screen change - without this a tap can look
   like it did nothing, because the new screen renders while the page stays
   scrolled where you were. */
function toTop(){
  try{ window.scrollTo(0,0); }catch(e){}
  try{ document.body.scrollTop = 0; document.documentElement.scrollTop = 0; }catch(e){}
}

/* Attach a handler without letting one missing element break the rest. */
function on(id, ev, fn){
  const el = document.getElementById(id);
  if(el) el.addEventListener(ev, fn);
  return el;
}

function daysSinceLastBackup(){
  const last = localStorage.getItem("thb_tracker_last_backup");
  if(!last) return null;
  const diffMs = Date.now() - new Date(last).getTime();
  return Math.floor(diffMs / 86400000);
}

function renderHome(view, year){
  view = (view === "months") ? "months"
       : (view === "years") ? "years"
       : (view === "weight") ? "weight"
       : (view === "calories") ? "calories"
       : "weeks";
  year = (year === "all") ? "all" : (YEARS.includes(year) ? year : defaultYear());
  const all = (year === "all");
  const start = fmtFull(TODAY), end = fmtFull(addDays(WEEK1_MONDAY, NUM_WEEKS*7-1));

  const weekRows = WEEKS.map((wk,idx)=>({wk,idx}))
    .filter(({wk})=> all || wk.days[0].date.getFullYear()===year)
    .map(o=>({...o, done: weekIsComplete(o.idx)}))
    .sort((a,b)=> (a.done===b.done) ? a.idx-b.idx : (a.done?1:-1))
    .map(({wk,idx,done})=>{
      const ws = wk.days[0].date, we = wk.days[wk.days.length-1].date;
      const label = wk.isLeadIn ? "Lead-in Week" : wk.label;
      const per = (weekHasPeriod(idx) || weekStarCount(idx) > 0) ? " has-period" : "";
      const dn = done ? " is-done" : "";
      const hearts = weekHeartCount(idx);
      const drops = weekPeriodCount(idx);
      const stars = weekStarCount(idx);
      const heartHTML = hearts
        ? `<span class="row-hearts">${svgHeart("#E0245E", true).repeat(hearts)}</span>`
        : ``;
      const dropHTML = drops
        ? `<span class="row-hearts">${svgTear("#E0245E", true).repeat(drops)}</span>`
        : ``;
      const starHTML = stars
        ? `<span class="row-hearts">${svgStar("#EC4899", true).repeat(stars)}</span>`
        : ``;
      return `<div class="week-row${per}${dn}" data-idx="${idx}">
        <div><div class="label">${label}${done?` <span class="done-tick">✓</span>`:``}</div><div class="range">${fmtShort(ws)} – ${fmtShort(we)}${all?", "+ws.getFullYear():""}</div></div>
        <div class="row-right">${heartHTML}${dropHTML}${starHTML}<span class="arrow">›</span></div>
      </div>`;
    }).join("");

  const monthRows = MONTHS.map((m,idx)=>({m,idx}))
    .filter(({m})=> all || m.year===year)
    .map(o=>({...o, done: entriesAreComplete(o.m.entries)}))
    .sort((a,b)=> (a.done===b.done) ? a.idx-b.idx : (a.done?1:-1))
    .map(({m,idx,done})=>{
      return `<div class="week-row month-row${done?" is-done":""}" data-midx="${idx}">
        <div><div class="label">${fmtMonth(m)}${done?` <span class="done-tick">✓</span>`:``}</div><div class="range">${m.entries.length} days</div></div>
        <div class="arrow">›</div>
      </div>`;
    }).join("");

  const yearRows = YEAR_INDEX.map((y,idx)=>({y,idx}))
    .map(o=>({...o, done: entriesAreComplete(o.y.entries)}))
    .sort((a,b)=> (a.done===b.done) ? a.idx-b.idx : (a.done?1:-1))
    .map(({y,idx,done})=>{
      return `<div class="week-row year-row${done?" is-done":""}" data-yidx="${idx}">
        <div><div class="label">${y.year}${done?` <span class="done-tick">✓</span>`:``}</div><div class="range">${y.entries.length} days</div></div>
        <div class="arrow">›</div>
      </div>`;
    }).join("");

  // Weight log table (weight view)
  const weighIns = allWeighIns();
  let weightTable;
  if(!weighIns.length){
    weightTable = `<div class="backup-caption">No weigh-ins logged yet. Weight can be entered on any day.</div>`;
  } else {
    const base = getStartWeight();
    let prev = null;
    const trs = weighIns.map(w=>{
      const vsStart = w.weight - base;
      const vsPrev = prev===null ? null : (w.weight - prev);
      prev = w.weight;
      const fmtDelta = (v)=>{
        if(v===null) return `<span class="wt-flat">—</span>`;
        if(Math.abs(v) < 0.05) return `<span class="wt-flat">0.0</span>`;
        const cls = v < 0 ? "wt-down" : "wt-up";
        const sign = v < 0 ? "−" : "+";
        return `<span class="${cls}">${sign}${Math.abs(v).toFixed(1)}</span>`;
      };
      return `<tr>
        <td class="wt-date">${w.date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"})}<span class="wt-day">${w.dayName.slice(0,3)}</span></td>
        <td class="wt-val">${w.weight.toFixed(1)}</td>
        <td class="wt-delta">${fmtDelta(vsPrev)}</td>
        <td class="wt-delta">${fmtDelta(vsStart)}</td>
      </tr>`;
    }).reverse().join("");   // newest first
    const net = weighIns[weighIns.length-1].weight - base;
    const netCls = net < 0 ? "wt-down" : (net > 0 ? "wt-up" : "wt-flat");
    const netSign = net < 0 ? "−" : (net > 0 ? "+" : "");
    weightTable = `
      <div class="wt-summary">
        <span>${weighIns.length} weigh-in${weighIns.length===1?"":"s"}</span>
        <span>Net: <strong class="${netCls}">${netSign}${Math.abs(net).toFixed(1)} lb</strong></span>
      </div>
      <div class="wt-wrap">
        <table class="wt-table">
          <thead><tr><th>Date</th><th>Weight</th><th>Change</th><th>vs Start</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  // Average calories per week (calories view)
  const calWeeks = weeklyCalorieRows();
  let calTable;
  if(!calWeeks.length){
    calTable = `<div class="backup-caption">No calories logged yet. Enter Actual Calories on any day to see weekly averages here.</div>`;
  } else {
    const trs = calWeeks.map(r=>{
      const s = r.stats;
      const avg = Math.round(s.avgCal);
      const planAvg = s.calGoal / s.dayCount;      // planned average for that week
      const delta = avg - planAvg;
      const cls = delta < 0 ? "wt-down" : (delta > 0 ? "wt-up" : "wt-flat");
      const sign = delta < 0 ? "−" : (delta > 0 ? "+" : "");
      const lbl = r.wk.isLeadIn ? "Lead-in" : r.wk.label;
      const isRed = weekHasPeriod(r.idx) || weekStarCount(r.idx) > 0;
      const wtCell = (s.lastWeight===null)
        ? `<span class="wt-flat">—</span>`
        : `${s.lastWeight.toFixed(1)}`;
      return `<tr${isRed ? ` class="row-red"` : ``}>
        <td class="wt-date">${lbl}<span class="wt-day">${fmtShort(r.start)}</span></td>
        <td class="wt-val">${avg.toLocaleString()}</td>
        <td class="wt-delta"><span class="${cls}">${sign}${Math.abs(Math.round(delta)).toLocaleString()}</span></td>
        <td class="wt-val">${wtCell}</td>
        <td class="wt-delta"><span class="wt-flat">${s.calCount}/${s.dayCount}</span></td>
      </tr>`;
    }).reverse().join("");   // newest first
    const totalCal = calWeeks.reduce((a,r)=>a+r.stats.actualCal, 0);
    const totalDays = calWeeks.reduce((a,r)=>a+r.stats.calCount, 0);
    const overall = Math.round(totalCal/totalDays);
    calTable = `
      <div class="wt-summary">
        <span>${calWeeks.length} week${calWeeks.length===1?"":"s"} logged</span>
        <span>Overall avg: <strong>${overall.toLocaleString()} / day</strong></span>
      </div>
      <div class="wt-wrap">
        <table class="wt-table">
          <thead><tr><th>Week</th><th>Avg / Day</th><th>vs Plan</th><th>Weight</th><th>Days</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  const rows = (view==="months" ? monthRows
              : view==="years" ? yearRows
              : view==="weight" ? weightTable
              : view==="calories" ? calTable
              : weekRows)
    || `<div class="backup-caption">Nothing in ${year} for this view.</div>`;
  const listTitle = view==="months" ? "Monthly Summaries"
                  : view==="years" ? "Yearly Summaries"
                  : view==="weight" ? "Weight Log"
                  : view==="calories" ? "Avg Calories / Week"
                  : "Weeks";
  const yearBar = [`<button class="year-btn ${all?"active":""}" data-yr="all">All</button>`]
    .concat(YEARS.map(yr=>
      `<button class="year-btn ${yr===year?"active":""}" data-yr="${yr}">${yr}</button>`
    )).join("");

  const daysSince = daysSinceLastBackup();
  const REMIND_AFTER = 7;
  let banner = "";
  if(daysSince===null){
    banner = `<div class="backup-banner">🛟 <span><strong>You haven't backed up yet.</strong> Tap "Backup Data" below to save a copy of your entries.</span></div>`;
  } else if(daysSince >= REMIND_AFTER){
    banner = `<div class="backup-banner">🛟 <span><strong>It's been ${daysSince} days</strong> since your last backup — tap "Backup Data" below for a fresh copy.</span></div>`;
  }
  const caption = daysSince!==null
    ? `<div class="backup-caption">Last backup: ${daysSince===0?"today":daysSince+" day"+(daysSince===1?"":"s")+" ago"}</div>`
    : "";

  const startW = getStartWeight();
  const latest = latestWeight();
  let curHTML, chgHTML;
  if(latest){
    const diff = latest.weight - startW;          // negative = lost
    const cls = diff < 0 ? "loss" : (diff > 0 ? "gain" : "none");
    const sign = diff < 0 ? "−" : (diff > 0 ? "+" : "");
    const when = new Date(latest.key + "T00:00:00")
      .toLocaleDateString("en-US",{month:"short",day:"numeric"});
    curHTML = `<div class="cur">${latest.weight.toFixed(1)} lb</div>`;
    chgHTML = `<div class="chg ${cls}">${sign}${Math.abs(diff).toFixed(1)} lb ${
      diff<0?"lost":(diff>0?"gained":"— no change")} · as of ${when}</div>`;
  } else {
    curHTML = `<div class="cur" style="color:var(--muted)">—</div>`;
    chgHTML = `<div class="chg none">Log a weight to see progress</div>`;
  }

  const weightPanel = `
    <div class="weight-panel">
      <div class="weight-box">
        <div class="lbl">Starting Weight</div>
        <div class="cur">${startW.toFixed(1)} lb</div>
        <div class="chg none">as of ${START_WEIGHT_DATE}</div>
      </div>
      <div class="weight-box">
        <div class="lbl">Current Weight</div>
        ${curHTML}
        ${chgHTML}
      </div>
    </div>`;

  app.innerHTML = `
    <div class="brand">
      <h1>Theresa Borowski</h1>
      <div class="sub">Health &amp; Activity Tracker</div>
      <div class="years">${YEARS[0]} ~ ${YEARS[YEARS.length-1]}</div>
      <div class="quote">&ldquo;Discipline is choosing between what you want now and what you want most.&rdquo;</div>
    </div>
    ${banner}
    ${weightPanel}
    <div class="toolbar">
      <button class="btn" id="backupBtn">⬇ Backup Data</button>
      <button class="btn ghost" id="restoreBtn">⬆ Restore Backup</button>
      <input type="file" id="restoreFile" accept="application/json" style="display:none;">
    </div>
    ${caption}
    <div class="toolbar">
      <div class="view-toggle">
        <button class="btn ${view==="weeks"?"active":"ghost"}" id="weeksTab">Weeks</button>
        <button class="btn ${view==="months"?"active":"ghost"}" id="monthsTab">Months</button>
        <button class="btn ${view==="years"?"active":"ghost"}" id="yearsTab">Years</button>
        <button class="btn ${view==="calories"?"active":"ghost"}" id="calTab">Calories</button>
        <button class="btn ${view==="weight"?"active":"ghost"}" id="weightTab">Weight</button>
      </div>
    </div>
    ${(view==="years"||view==="weight"||view==="calories") ? `` : `<div class="year-bar">${yearBar}</div>`}
    <div class="toolbar">
      <strong style="color:var(--teal-deep); font-size:14px;">${listTitle}${(view==="years"||view==="weight"||view==="calories") ? `` : ` · ${all?"All years":year}`}</strong>
      <span style="color:var(--muted); font-size:12px;">${start} – ${end}</span>
    </div>
    <div class="week-list">${rows}</div>
  `;
  on("weeksTab", "click", ()=>renderHome("weeks", year));
  on("monthsTab", "click", ()=>renderHome("months", year));
  on("yearsTab", "click", ()=>renderHome("years", year));
  on("weightTab", "click", ()=>renderHome("weight", year));
  on("calTab", "click", ()=>renderHome("calories", year));
  app.querySelectorAll(".year-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      const v = b.dataset.yr;
      renderHome(view, v==="all" ? "all" : parseInt(v,10));
    });
  });
  app.querySelectorAll(".week-row").forEach(r=>{
    r.addEventListener("click", ()=>{
      if(r.dataset.yidx!==undefined) renderYear(parseInt(r.dataset.yidx,10));
      else if(r.dataset.midx!==undefined) renderMonth(parseInt(r.dataset.midx,10));
      else renderWeek(parseInt(r.dataset.idx,10));
    });
  });
  on("backupBtn", "click", exportBackup);
  on("restoreBtn", "click", ()=>{
    const f = document.getElementById("restoreFile");
    if(f) f.click();
  });
  on("restoreFile", "change", (e)=>{
    if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  });
  toTop();
}

function exportBackup(){
  const backup = {app:"Theresa Health Tracker", version:2, exportedAt:new Date().toISOString(), weeks:{}, monthNotes:{}};
  for (let i=0;i<WEEKS.length;i++){
    const raw = localStorage.getItem("thb_tracker_week_"+i);
    if(raw) backup.weeks[i] = JSON.parse(raw);
  }
  MONTHS.forEach(m=>{
    const mv = localStorage.getItem("thb_tracker_monthnotes_"+m.key);
    if(mv) backup.monthNotes[m.key] = mv;
  });
  backup.yearNotes = {};
  YEAR_INDEX.forEach(y=>{
    const yv = localStorage.getItem("thb_tracker_yearnotes_"+y.year);
    if(yv) backup.yearNotes[y.year] = yv;
  });
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `health-tracker-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  localStorage.setItem("thb_tracker_last_backup", new Date().toISOString());
  flashSaved("Backup downloaded");
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert("That file doesn't look like a valid backup."); return; }
    if(!parsed || !parsed.weeks){ alert("That file doesn't look like a valid backup."); return; }
    const ok = confirm("Restore this backup? This will overwrite any entries currently saved on this device.");
    if(!ok) return;
    Object.keys(parsed.weeks).forEach(idx=>{
      localStorage.setItem("thb_tracker_week_"+idx, JSON.stringify(parsed.weeks[idx]));
    });
    if(parsed.monthNotes){
      Object.keys(parsed.monthNotes).forEach(k=>{
        localStorage.setItem("thb_tracker_monthnotes_"+k, parsed.monthNotes[k]);
      });
    }
    if(parsed.yearNotes){
      Object.keys(parsed.yearNotes).forEach(k=>{
        localStorage.setItem("thb_tracker_yearnotes_"+k, parsed.yearNotes[k]);
      });
    }
    flashSaved("Backup restored");
    renderHome();
  };
  reader.readAsText(file);
}

async function renderWeek(idx){
  const wk = WEEKS[idx];
  const data = await loadWeek(idx);
  const ws = wk.days[0].date, we = wk.days[wk.days.length-1].date;
  const label = wk.isLeadIn
    ? "Lead-in Week"
    : `${wk.label} of ${wk.weeksInYear} · ${wk.year}`;

  app.innerHTML = `
    <div class="week-header">
      <h2>${label}</h2>
      <div class="range">${fmtFull(ws)} – ${fmtFull(we)}</div>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="backBtn">← All Weeks</button>
      <div style="display:flex; gap:8px;">
        ${idx>0 ? `<button class="btn" id="prevBtn">‹ Prev</button>` : ``}
        ${idx<WEEKS.length-1 ? `<button class="btn" id="nextBtn">Next ›</button>` : ``}
      </div>
    </div>
    <div id="days"></div>
    <div class="summary-card" id="summary"></div>
  `;
  on("backBtn", "click", ()=>renderHome("weeks", ws.getFullYear()));
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  if(prevBtn) prevBtn.onclick = ()=>renderWeek(idx-1);
  if(nextBtn) nextBtn.onclick = ()=>renderWeek(idx+1);

  const daysEl = document.getElementById("days");
  daysEl.innerHTML = wk.days.map(d=>dayCardHTML(d, data[iso(d.date)] || {})).join("");

  // wire inputs
  wk.days.forEach(d=>{
    const key = iso(d.date);
    if(!data[key]) data[key] = {};
    const rec = data[key];
    const card = daysEl.querySelector(`[data-day="${key}"]`);

    // editable IRON DAY - blank reverts to the planned value
    const ironEl = card.querySelector(`[data-f="ironDay"]`);
    if(ironEl){
      ironEl.addEventListener("input", ()=>{
        if(ironEl.value.trim()===""){ delete rec.ironDay; }
        else { rec.ironDay = ironEl.value; }
        scheduleSave(idx,data);
      });
      ironEl.addEventListener("blur", ()=>{
        if(ironEl.value.trim()===""){ ironEl.value = d.ironDay; delete rec.ironDay; scheduleSave(idx,data); }
      });
    }

    // Heart + Period tappable icons next to the date (teal -> red when on)
    [["heart", svgHeart], ["period", svgTear]].forEach(([fname, svgFn])=>{
      const el = card.querySelector(`[data-toggle="${fname}"]`);
      if(!el) return;
      el.addEventListener("click", ()=>{
        rec[fname] = !rec[fname];
        el.classList.toggle("on", !!rec[fname]);
        el.innerHTML = svgFn(rec[fname] ? "#E0245E" : "var(--teal)", !!rec[fname]);
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
    });

    // Star toggle - fills pink
    const starEl = card.querySelector(`[data-toggle="star"]`);
    if(starEl){
      starEl.addEventListener("click", ()=>{
        rec.star = !rec.star;
        starEl.classList.toggle("on", !!rec.star);
        starEl.innerHTML = svgStar(rec.star ? "#EC4899" : "var(--teal)", !!rec.star);
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
    }

    // "Complete" circle - stays teal, fills in when the day is done
    const compEl = card.querySelector(`[data-toggle="complete"]`);
    if(compEl){
      compEl.addEventListener("click", ()=>{
        rec.complete = !rec.complete;
        compEl.classList.toggle("on", !!rec.complete);
        compEl.innerHTML = svgCircle("var(--teal)", !!rec.complete);
        card.classList.toggle("is-complete", !!rec.complete);
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
    }

    // "Workout done" toggle on Iron days
    const ironBox = card.querySelector(`[data-ironbox="1"]`);
    if(ironBox){
      if(rec.ironDone) ironBox.classList.add("checked");
      ironBox.addEventListener("click", ()=>{
        rec.ironDone = !rec.ironDone;
        ironBox.classList.toggle("checked", !!rec.ironDone);
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
    }

    // "Run done" toggle on Run days
    const runBox = card.querySelector(`[data-runbox="1"]`);
    if(runBox){
      if(rec.runDone) runBox.classList.add("checked");
      runBox.addEventListener("click", ()=>{
        rec.runDone = !rec.runDone;
        runBox.classList.toggle("checked", !!rec.runDone);
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
    }

    // editable Target Calories - blank reverts to the planned value
    const tcEl = card.querySelector(`[data-f="targetCal"]`);
    if(tcEl){
      tcEl.addEventListener("input", ()=>{
        if(tcEl.value.trim()===""){ delete rec.targetCal; }
        else { rec.targetCal = tcEl.value; }
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
      tcEl.addEventListener("blur", ()=>{
        if(tcEl.value.trim()===""){
          tcEl.value = d.targetCal; delete rec.targetCal;
          scheduleSave(idx,data); renderSummary(wk,data,idx);
        }
      });
    }

    ["weight","actualCal","protein","miles","steps","sleep","notes"].forEach(f=>{
      const el = card.querySelector(`[data-f="${f}"]`);
      if(!el) return;
      if(rec[f]!==undefined) el.value = rec[f];
      el.addEventListener("input", ()=>{
        rec[f]=el.value;
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
    });

    ["move","exercise","stand"].forEach(r=>{
      const el = card.querySelector(`[data-ring="${r}"]`);
      if(!el) return;
      if(rec[r]) el.classList.add("checked");
      el.addEventListener("click", ()=>{
        rec[r] = !rec[r];
        el.classList.toggle("checked", !!rec[r]);
        scheduleSave(idx,data);
        renderSummary(wk,data,idx);
      });
    });
  });

  renderSummary(wk,data,idx);
  toTop();
}

function num(v){ const n=parseFloat(v); return isNaN(n)?null:n; }

/* Protein goal: 875-1050 g per week = 125-150 g per day.
   Scaling per-day keeps the weekly and monthly summaries both accurate. */
const PROTEIN_MIN_PER_DAY = 125;
const PROTEIN_MAX_PER_DAY = 150;
function proteinGoalFor(dayCount){
  return (PROTEIN_MIN_PER_DAY*dayCount).toLocaleString() + "–" +
         (PROTEIN_MAX_PER_DAY*dayCount).toLocaleString() + " g";
}

/* Shared aggregation used by both the weekly and monthly summaries.
   `pairs` is an array of {day, rec}. */
function computeStats(pairs){
  let calGoal=0, actualCal=0, protein=0, miles=0, steps=0;
  let calCount=0, proteinCount=0, milesCount=0, stepsCount=0;
  let sleepSum=0, sleepCount=0;
  let moveCount=0, exerciseCount=0, standCount=0;
  let ironCompleted=0, ironTotal=0;
  let runCompleted=0, runTotal=0;
  let heartCount=0, periodCount=0, completeCount=0, starCount=0;
  const weightEntries=[];

  pairs.forEach(({day, rec})=>{
    rec = rec || {};
    calGoal += effectiveTarget(day, rec);
    const ac = num(rec.actualCal); if(ac!==null){ actualCal+=ac; calCount++; }
    const pr = num(rec.protein);   if(pr!==null){ protein+=pr; proteinCount++; }
    const mi = num(rec.miles);     if(mi!==null){ miles+=mi; milesCount++; }
    const st = num(rec.steps);     if(st!==null){ steps+=st; stepsCount++; }
    const sl = num(rec.sleep);     if(sl!==null){ sleepSum+=sl; sleepCount++; }
    const wt = num(rec.weight);    if(wt!==null) weightEntries.push(wt);
    if(rec.heart) heartCount++;
    if(rec.period) periodCount++;
    if(rec.complete) completeCount++;
    if(rec.star) starCount++;
    if(rec.move) moveCount++;
    if(rec.exercise) exerciseCount++;
    if(rec.stand) standCount++;
    if(day.dayType==="Iron"){
      ironTotal++;
      if(rec.ironDone) ironCompleted++;
    }
    if(day.dayType==="Run"){
      runTotal++;
      if(rec.runDone) runCompleted++;
    }
  });

  let weightTxt = "—";
  if(weightEntries.length>=2){
    const diff = weightEntries[0]-weightEntries[weightEntries.length-1];
    weightTxt = (diff>=0?"":"+") + Math.abs(diff).toFixed(1) + " lb" + (diff<0?" (gained)":"");
  }
  const firstWeight = weightEntries.length ? weightEntries[0] : null;
  const lastWeight  = weightEntries.length ? weightEntries[weightEntries.length-1] : null;

  const avgSleep = sleepCount ? (sleepSum/sleepCount) : null;

  const avgCal = calCount ? (actualCal/calCount) : null;
  const avgProtein = proteinCount ? (protein/proteinCount) : null;
  const avgMiles = milesCount ? (miles/milesCount) : null;
  const avgSteps = stepsCount ? (steps/stepsCount) : null;

  return {calGoal, actualCal, avgCal, calCount, protein, miles, steps,
          avgProtein, avgMiles, avgSteps, proteinCount, milesCount, stepsCount,
          avgSleep, sleepCount,
          moveCount, exerciseCount, standCount, ironCompleted, ironTotal,
          runCompleted, runTotal, heartCount, periodCount, completeCount, starCount,
          weightTxt, firstWeight, lastWeight, dayCount: pairs.length};
}

function statRowsHTML(s){
  return `
    <div class="stat-rows">
      <div class="stat-row"><span class="k">Actual Calories</span><span class="v">${s.actualCal ? s.actualCal.toLocaleString() : "—"}</span></div>
      <div class="stat-row"><span class="k">Avg Calories / Day</span><span class="v">${s.avgCal!==null ? Math.round(s.avgCal).toLocaleString() : "—"}</span></div>
      <div class="stat-row"><span class="k">Actual Protein</span><span class="v">${s.protein ? s.protein+" g" : "—"}</span></div>
      <div class="stat-row"><span class="k">Avg Protein / Day</span><span class="v">${s.avgProtein!==null ? Math.round(s.avgProtein)+" g" : "—"}</span></div>
      <div class="stat-row"><span class="k">Total Weight Change</span><span class="v">${s.weightTxt}</span></div>
      <div class="stat-row"><span class="k">Total Miles</span><span class="v">${s.miles ? s.miles.toFixed(1) : "—"}</span></div>
      <div class="stat-row"><span class="k">Avg Miles / Day</span><span class="v">${s.avgMiles!==null ? s.avgMiles.toFixed(1) : "—"}</span></div>
      <div class="stat-row"><span class="k">Total Steps</span><span class="v">${s.steps ? s.steps.toLocaleString() : "—"}</span></div>
      <div class="stat-row"><span class="k">Avg Steps / Day</span><span class="v">${s.avgSteps!==null ? Math.round(s.avgSteps).toLocaleString() : "—"}</span></div>
      <div class="stat-row"><span class="k">Average Sleep</span><span class="v">${s.avgSleep!==null ? s.avgSleep.toFixed(1)+" hrs" : "—"}</span></div>
      <div class="stat-row"><span class="k">IRON Workouts Completed</span><span class="v">${s.ironCompleted} / ${s.ironTotal}</span></div>
      <div class="stat-row"><span class="k">Runs Completed</span><span class="v">${s.runCompleted} / ${s.runTotal}</span></div>

      <div class="stat-row"><span class="k">Star</span><span class="v">${s.starCount}</span></div>
      <div class="stat-row"><span class="k">Complete</span><span class="v">${s.completeCount} / ${s.dayCount}</span></div>
    </div>`;
}

/* Start / end weight rows - used on the monthly and yearly summaries. */
function weightRangeRowsHTML(s){
  const fmt = v => v===null ? "—" : v.toFixed(1)+" lb";
  return `
    <div class="stat-rows">
      <div class="stat-row"><span class="k">Starting Weight</span><span class="v">${fmt(s.firstWeight)}</span></div>
      <div class="stat-row"><span class="k">Ending Weight</span><span class="v">${fmt(s.lastWeight)}</span></div>
    </div>`;
}

function renderSummary(wk,data,weekIdx){
  const el = document.getElementById("summary");
  const pairs = wk.days.map(d=>({day:d, rec:data[iso(d.date)]}));
  const s = computeStats(pairs);

  el.innerHTML = `
    <h2>Weekly Summary</h2>
    <div class="goal-boxes">
      <div class="goal-box"><div class="lbl">WEEKLY CALORIE GOAL</div><div class="val">${s.calGoal.toLocaleString()}</div></div>
      <div class="goal-box"><div class="lbl">PROTEIN GOAL</div><div class="val">${proteinGoalFor(s.dayCount)}</div></div>
    </div>
    ${statRowsHTML(s)}
    <div class="summary-notes">
      <label>Week Notes</label>
      <textarea id="weekNotes" placeholder="How did the week go? Energy, sleep, cycle, anything worth remembering..."></textarea>
    </div>
    <div class="live-note">Totals update automatically as you fill in each day above.</div>
  `;

  const wn = document.getElementById("weekNotes");
  if(wn){
    if(!data.__summary) data.__summary = {};
    wn.value = data.__summary.notes || "";
    wn.addEventListener("input", ()=>{
      data.__summary.notes = wn.value;
      scheduleSave(weekIdx, data);
    });
  }
}

async function renderMonth(mIdx){
  const m = MONTHS[mIdx];
  const weekIdxs = Array.from(new Set(m.entries.map(e=>e.weekIdx)));
  const loaded = {};
  await Promise.all(weekIdxs.map(async wi=>{ loaded[wi] = await loadWeek(wi); }));

  const pairs = m.entries.map(e=>({day:e.day, rec:(loaded[e.weekIdx]||{})[iso(e.day.date)]}));
  const s = computeStats(pairs);

  const first = m.entries[0].day.date;
  const last = m.entries[m.entries.length-1].day.date;

  app.innerHTML = `
    <div class="week-header">
      <h2>${fmtMonth(m)}</h2>
      <div class="range">${fmtFull(first)} – ${fmtFull(last)} &nbsp;·&nbsp; ${m.entries.length} days tracked</div>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="backBtn">← All Months</button>
      <div style="display:flex; gap:8px;">
        ${mIdx>0 ? `<button class="btn" id="prevBtn">‹ Prev</button>` : ``}
        ${mIdx<MONTHS.length-1 ? `<button class="btn" id="nextBtn">Next ›</button>` : ``}
      </div>
    </div>
    <div class="summary-card">
      <h2>Monthly Summary</h2>
      <div class="goal-boxes">
        <div class="goal-box"><div class="lbl">MONTHLY CALORIE GOAL</div><div class="val">${s.calGoal.toLocaleString()}</div></div>
        <div class="goal-box"><div class="lbl">PROTEIN GOAL</div><div class="val">${proteinGoalFor(s.dayCount)}</div></div>
      </div>
      ${statRowsHTML(s)}
      ${weightRangeRowsHTML(s)}
      <div class="summary-notes">
        <label>Month Notes</label>
        <textarea id="monthNotes" placeholder="Overall trend, what worked, what to adjust next month..."></textarea>
      </div>
      <div class="live-note">Calculated from every day you've logged in ${fmtMonth(m)}.</div>
    </div>
  `;

  const mn = document.getElementById("monthNotes");
  if(mn){
    try{ mn.value = localStorage.getItem("thb_tracker_monthnotes_"+m.key) || ""; }catch(e){}
    let mTimer=null;
    mn.addEventListener("input", ()=>{
      clearTimeout(mTimer);
      mTimer = setTimeout(()=>{
        try{
          localStorage.setItem("thb_tracker_monthnotes_"+m.key, mn.value);
          flashSaved();
        }catch(e){ console.error("month note save failed", e); }
      }, 450);
    });
  }
  on("backBtn", "click", ()=>renderHome("months", m.year));
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  if(prevBtn) prevBtn.onclick = ()=>renderMonth(mIdx-1);
  if(nextBtn) nextBtn.onclick = ()=>renderMonth(mIdx+1);
  toTop();
}

async function renderYear(yIdx){
  const y = YEAR_INDEX[yIdx];
  const weekIdxs = Array.from(new Set(y.entries.map(e=>e.weekIdx)));
  const loaded = {};
  await Promise.all(weekIdxs.map(async wi=>{ loaded[wi] = await loadWeek(wi); }));

  const recFor = (e)=> (loaded[e.weekIdx]||{})[iso(e.day.date)];
  const pairs = y.entries.map(e=>({day:e.day, rec:recFor(e)}));
  const s = computeStats(pairs);

  const first = y.entries[0].day.date;
  const last = y.entries[y.entries.length-1].day.date;

  app.innerHTML = `
    <div class="week-header">
      <h2>${y.year}</h2>

    <div class="summary-card">

      <div class="goal-boxes">
        <div class="goal-box"><div class="lbl">YEARLY CALORIE GOAL</div><div class="val">${s.calGoal.toLocaleString()}</div></div>
        <div class="goal-box"><div class="lbl">PROTEIN GOAL</div><div class="val">${proteinGoalFor(s.dayCount)}</div></div>

      </div>

  `;

  const yn = document.getElementById("yearNotes");
  if(yn){
    try{ yn.value = localStorage.getItem("thb_tracker_yearnotes_"+y.year) || ""; }catch(e){}
    let yTimer=null;

      yTimer = setTimeout(()=>{
        try{
          localStorage.setItem("thb_tracker_yearnotes_"+y.year, yn.value);
          flashSaved();
        }catch(e){ console.error("year note save failed", e); }
      }, 450);
    });
  }

  on("backBtn", "click", ()=>renderHome("years", y.year));
  const pB = document.getElementById("prevBtn");
  const nB = document.getElementById("nextBtn");
  if(pB) pB.onclick = ()=>renderYear(yIdx-1);
  if(nB) nB.onclick = ()=>renderYear(yIdx+1);
  toTop();
}

/* On launch, jump straight to the week containing today (and scroll to
   today's card). Falls back to the home list if today is outside the plan. */
function todayWeekIndex(){
  const key = iso(new Date());
  for(let i=0;i<WEEKS.length;i++){
    if(WEEKS[i].days.some(d=>iso(d.date)===key)) return i;
  }
  return -1;
}

function scrollToToday(){
  const key = iso(new Date());
  const card = document.querySelector(`[data-day="${key}"]`);
  if(!card) return;
  card.classList.add("is-today");
  if(card.scrollIntoView){
    try{ card.scrollIntoView({block:"start", behavior:"auto"}); }
    catch(e){ card.scrollIntoView(); }
  }
}

(function start(){
  const wi = todayWeekIndex();
  if(wi >= 0){
    Promise.resolve(renderWeek(wi))
      .then(()=>{ setTimeout(scrollToToday, 60); })
      .catch(()=>renderHome());
  } else {
    renderHome();
  }
})();
